openapi: 3.0.3

info:
  title: Match Predictor API
  version: 1.0.0
  description: REST API for a football match prediction system.

servers:
  - url: http://localhost:3000

paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - role
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum:
                    - user
                    - admin

      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user registered successfully

        "400":
          description: Missing required data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: missing data

        "409":
          description: Username or email already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: username already in use

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /auth/login:
    post:
      summary: User login
      description: Authenticates a user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string

      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        "400":
          description: Missing required data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: missing data

        "401":
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: unauthorized access

        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Refreshes the access token using a valid refresh token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string

      responses:
        "200":
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        "400":
          description: Token not present
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: token not present

        "401":
          description: Refresh token not found or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                userNotFound:
                  summary: User not found
                  value:
                    message: user not found

                tokenExpired:
                  summary: Refresh token expired
                  value:
                    message: refresh token expired

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /auth/logout:
    post:
      summary: User logout
      description: Logs out a user

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logout successful

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /users/me:
    get:
      summary: Get authenticated user
      description: Returns the public data of the authenticated user.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Authenticated user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicData:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: davide
                      email:
                        type: string
                        format: email
                        example: davide@example.com
                      role:
                        type: string
                        enum:
                          - user
                          - admin
                        example: user
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-04-15T10:30:00Z"

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /users/{id}:
    get:
      summary: Get user by ID
      description: Returns the public data of a user identified by their ID.

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user.
          schema:
            type: integer
            example: 1

      responses:
        "200":
          description: User data
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicData:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: davide
                      email:
                        type: string
                        format: email
                        example: davide@example.com
                      role:
                        type: string
                        enum:
                          - user
                          - admin
                        example: user
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-04-15T10:30:00Z"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /weeks:
    post:
      summary: Create a new week
      description: Creates a new week. Requires an authenticated admin user.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weekNumber
              properties:
                weekNumber:
                  type: integer
                  example: 9

      responses:
        "201":
          description: Week created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: week registered successfully

        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: missing field

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "403":
          description: User does not have the required admin role
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "forbidden: admin role required"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

    get:
      summary: Get all weeks
      description: Returns the list of all weeks.

      responses:
        "200":
          description: List of weeks
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        week_number:
                          type: integer
                          example: 1

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /teams:
    post:
      summary: Create a new team
      description: Creates a new team. Requires an authenticated admin user.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Inter

      responses:
        "201":
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: team registered successfully

        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: missing field

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "403":
          description: User does not have the required admin role
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "forbidden: admin role required"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

    get:
      summary: Get all teams
      description: Returns the list of all teams.

      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Inter

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /matches:
    post:
      summary: Create a new match
      description: Creates a new match. Requires an authenticated admin user.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weekId
                - homeTeamId
                - awayTeamId
                - result
              properties:
                weekId:
                  type: integer
                  example: 1
                homeTeamId:
                  type: integer
                  example: 1
                awayTeamId:
                  type: integer
                  example: 2
                result:
                  type: string
                  enum:
                    - "1"
                    - "X"
                    - "2"
                  example: "1"

      responses:
        "201":
          description: Match created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: match registered successfully

        "400":
          description: Missing required field or identical home and away teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    message: missing field

                sameTeams:
                  summary: Home and away teams are the same
                  value:
                    message: home team and away team cannot be the same

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "403":
          description: User does not have the required admin role
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "forbidden: admin role required"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

    get:
      summary: Get all matches
      description: Returns the list of all matches, optionally filtered by week.

      parameters:
        - name: week
          in: query
          required: false
          description: Filters matches by week ID.
          schema:
            type: integer
            example: 3

      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        week_id:
                          type: integer
                          example: 1
                        home_team_id:
                          type: integer
                          example: 1
                        away_team_id:
                          type: integer
                          example: 2
                        result:
                          type: string
                          enum:
                            - "1"
                            - "X"
                            - "2"
                          example: "1"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /matches/{id}:
    get:
      summary: Get match by ID
      description: Returns the details of a single match identified by its ID.

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the match.
          schema:
            type: integer
            example: 1

      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      result:
                        type: string
                        enum:
                          - "1"
                          - "X"
                          - "2"
                        example: "1"
                      home_team:
                        type: string
                        example: Inter
                      away_team:
                        type: string
                        example: Milan

        "404":
          description: Match not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: match not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /matches/{id}/predict:
    post:
      summary: Create a prediction
      description: Creates a prediction for a specific match for the authenticated user.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the match.
          schema:
            type: integer
            example: 5

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prediction
              properties:
                prediction:
                  type: string
                  enum:
                    - "1"
                    - "X"
                    - "2"
                  example: "1"

      responses:
        "201":
          description: Prediction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: prediction registered successfully

        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: missing field

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "404":
          description: Match not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: match not found

        "409":
          description: Prediction already exists for this user and match
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: prediction already exists

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /users/me/predictions:
    get:
      summary: Get authenticated user's predictions
      description: Returns all predictions created by the authenticated user.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of the authenticated user's predictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        week_number:
                          type: integer
                          example: 3
                        home_team:
                          type: string
                          example: Inter
                        away_team:
                          type: string
                          example: Milan
                        prediction:
                          type: string
                          enum:
                            - "1"
                            - "X"
                            - "2"
                          example: "1"
                        result:
                          type: string
                          enum:
                            - "1"
                            - "X"
                            - "2"
                          example: "1"
                        points_awarded:
                          type: integer
                          example: 3

        "401":
          description: Missing, malformed, invalid, or expired authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingOrMalformedToken:
                  summary: Missing or malformed token
                  value:
                    message: missing or malformed token

                invalidOrExpiredToken:
                  summary: Invalid or expired token
                  value:
                    message: invalid or expired token

        "404":
          description: No predictions found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: no predictions found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /users/{id}/predictions:
    get:
      summary: Get user's predictions
      description: Returns all predictions created by a specific user.

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user.
          schema:
            type: integer
            example: 5

      responses:
        "200":
          description: List of the user's predictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        week_number:
                          type: integer
                          example: 3
                        home_team:
                          type: string
                          example: Inter
                        away_team:
                          type: string
                          example: Milan
                        prediction:
                          type: string
                          enum:
                            - "1"
                            - "X"
                            - "2"
                          example: "1"
                        result:
                          type: string
                          enum:
                            - "1"
                            - "X"
                            - "2"
                          example: "1"
                        points_awarded:
                          type: integer
                          example: 3

        "404":
          description: No predictions found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: no predictions found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

  /leaderboard:
    get:
      summary: Get leaderboard
      description: Returns the general leaderboard, optionally filtered by week and sorted by total points.

      parameters:
        - name: week
          in: query
          required: false
          description: Filters the leaderboard by week number.
          schema:
            type: integer
            example: 3

        - name: sort
          in: query
          required: false
          description: Sorts the leaderboard by total points. Use "asc" for ascending order. Any other value defaults to descending order.
          schema:
            type: string
            default: desc
            example: desc

      responses:
        "200":
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                          example: davide
                        total_bets:
                          type: integer
                          example: 8
                        total_points:
                          type: integer
                          example: 18
                        correct_predictions:
                          type: integer
                          example: 6
                        wrong_predictions:
                          type: integer
                          example: 2
                        accuracy:
                          type: number
                          format: float
                          example: 75.00

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
